# 4. BLOG REDIRECTS AND REAL 404 RESPONSES  (inside the HTTPS server block)
#
# React's catch-all shell must not answer unknown article URLs with HTTP 200.
# The build contains a directory/index.html for every real prerendered article,
# so nginx can serve known articles and return a real 404 for everything else.

# Google's older /blog/post/<slug> shape is still present in search results.
location ~ ^/blog/post/([^/]+)/?$ {
    return 301 /blog/$1;
}

# Historical article aliases that appeared in old internal links/search results.
location ~ ^/blog/are-online-chat-connections-real/?$ {
    return 301 /blog/online-friendships-are-real-friendships-heres-the-proof;
}
location ~ ^/blog/authentic-conversation-starters-for-online-dating/?$ {
    return 301 /blog/romantic-conversations-that-build-connection;
}
location ~ ^/blog/best-chat-topics-for-deep-meaningful-conversations/?$ {
    return 301 /blog/best-chat-topics-for-deep-conversations;
}
location ~ ^/blog/best-opening-lines-online-chat/?$ {
    return 301 /blog/best-opening-lines-for-online-chat-with-strangers;
}
location ~ ^/blog/breaking-the-ice/?$ {
    return 301 /blog/how-to-start-a-conversation-with-a-stranger-online;
}
location ~ ^/blog/breaking-through-loneliness-how-random-chat-can-be-a-first-step-to-connection/?$ {
    return 301 /blog/breaking-through-loneliness-random-chat-as-first-step;
}
location ~ ^/blog/building-trust-online/?$ {
    return 301 /blog/how-to-build-trust-with-someone-you-met-online;
}
location ~ ^/blog/chat-with-strangers-online/?$ {
    return 301 /blog/talk-to-strangers-online-free-no-registration-2026;
}
location ~ ^/blog/chatting-through-anxiety/?$ {
    return 301 /blog/how-to-overcome-social-anxiety-through-online-chat;
}
location ~ ^/blog/is-anonymous-chat-actually-safe/?$ {
    return 301 /blog/is-anonymous-chat-safe-guide-2026;
}
location ~ ^/blog/the-comfort-of-talking-to-a-stranger/?$ {
    return 301 /blog/why-we-connect-more-with-strangers-than-people-we-know;
}
location ~ ^/blog/turning-a-stranger-into-a-friend/?$ {
    return 301 /blog/how-to-turn-online-chat-into-real-life-friendship;
}

location /blog/ {
    root /var/www/chatrio;
    try_files $uri $uri/ =404;
}

error_page 404 /404.html;
location = /404.html {
    root /var/www/chatrio;
    internal;
}
