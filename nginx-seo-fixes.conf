# ─── Add these blocks to your nginx config ───────────────────────────────────
#
# 1. GZIP COMPRESSION  (add inside the http {} block, or the server {} block)
#    Fixes: "76 issues with uncompressed JavaScript and CSS files"

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    text/xml
    image/svg+xml
    font/woff
    font/woff2;


# 2. HSTS  (add inside each HTTPS server {} block — main domain AND www)
#    Fixes: "1 subdomain doesn't support HSTS"
#
#    WARNING: Start with a short max-age (e.g. 3600 = 1 hour) to test,
#    then increase to 63072000 (2 years) once confirmed working.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;


# 3. SECURITY HEADERS  (add inside each HTTPS server {} block)
#    Bonus: improves overall security posture

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;


# ─── EXAMPLE: Full server block structure ────────────────────────────────────
#
# http {
#     gzip on;
#     gzip_vary on;
#     gzip_min_length 1024;
