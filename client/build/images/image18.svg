<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="55%" stop-color="#0f4c42"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow18" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg18)"/>
  <ellipse cx="600" cy="320" rx="420" ry="320" fill="url(#glow18)"/>

  <!-- Unlocked padlock icon center -->
  <!-- Lock body -->
  <rect x="520" y="310" width="160" height="130" rx="18" fill="url(#tealGrad)" opacity="0.85"/>
  <!-- Lock shackle (open/unlocked - swings left) -->
  <path d="M 560 310 Q 520 230 490 240 Q 460 250 460 290 Q 460 310 480 310" fill="none" stroke="url(#tealGrad)" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <!-- Keyhole -->
  <circle cx="600" cy="362" r="16" fill="white" opacity="0.25"/>
  <rect x="594" y="362" width="12" height="22" rx="3" fill="white" opacity="0.25"/>

  <!-- Big checkmark circle -->
  <circle cx="600" cy="375" r="120" fill="none" stroke="url(#greenAccent)" stroke-width="3" stroke-dasharray="12,6" opacity="0.3"/>

  <!-- Registration form with X lines through it (left side) -->
  <rect x="80" y="230" width="220" height="200" rx="12" fill="white" opacity="0.05" stroke="white" stroke-width="1" stroke-opacity="0.12"/>
  <!-- Form fields -->
  <rect x="100" y="260" width="180" height="22" rx="4" fill="white" opacity="0.08"/>
  <rect x="100" y="296" width="180" height="22" rx="4" fill="white" opacity="0.08"/>
  <rect x="100" y="332" width="180" height="22" rx="4" fill="white" opacity="0.08"/>
  <rect x="100" y="368" width="100" height="30" rx="6" fill="white" opacity="0.08"/>
  <!-- X through form -->
  <line x1="80" y1="230" x2="300" y2="430" stroke="#f87171" stroke-width="3" opacity="0.5"/>
  <line x1="300" y1="230" x2="80" y2="430" stroke="#f87171" stroke-width="3" opacity="0.5"/>
  <text x="190" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#f87171" opacity="0.7" letter-spacing="1">NO SIGN-UP</text>

  <!-- Right side: instant chat bubbles -->
  <rect x="870" y="220" width="200" height="50" rx="16" fill="url(#tealGrad)" opacity="0.75"/>
  <text x="970" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="white">Start chatting →</text>
  <rect x="890" y="286" width="170" height="42" rx="14" fill="white" opacity="0.1"/>
  <rect x="870" y="344" width="190" height="42" rx="14" fill="url(#tealGrad)" opacity="0.55"/>
  <!-- Instant badge -->
  <rect x="880" y="410" width="190" height="36" rx="18" fill="#10b981" opacity="0.8"/>
  <text x="975" y="433" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="14" fill="white" font-weight="900" letter-spacing="1">⚡ INSTANT ACCESS</text>

  <!-- Zero stats bar at bottom -->
  <rect x="300" y="510" width="600" height="52" rx="10" fill="white" opacity="0.04" stroke="url(#tealGrad)" stroke-width="1" stroke-opacity="0.3"/>
  <text x="400" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#34d399" opacity="0.8">0 Email</text>
  <line x1="450" y1="520" x2="450" y2="552" stroke="white" stroke-width="1" opacity="0.15"/>
  <text x="540" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#34d399" opacity="0.8">0 Phone</text>
  <line x1="600" y1="520" x2="600" y2="552" stroke="white" stroke-width="1" opacity="0.15"/>
  <text x="690" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#34d399" opacity="0.8">0 Password</text>
  <line x1="750" y1="520" x2="750" y2="552" stroke="white" stroke-width="1" opacity="0.15"/>
  <text x="825" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#34d399" opacity="0.8">100% Free</text>

  <!-- Dot grid -->
  <pattern id="dots18" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="white" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots18)"/>

  <!-- Headings -->
  <text x="600" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="white" font-weight="bold">Free Anonymous Chat</text>
  <text x="600" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="url(#tealGrad)" font-weight="bold">No Sign Up Required</text>
  <text x="600" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#67e8f9" opacity="0.7" letter-spacing="2">NO EMAIL · NO PHONE · NO ACCOUNT · WORKS INSTANTLY</text>

  <text x="600" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.25" letter-spacing="3">CHATRIO.APP</text>
</svg>
