<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0a00"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bubbleOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow15a" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow15b" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg15)"/>
  <ellipse cx="250" cy="200" rx="350" ry="280" fill="url(#glow15a)"/>
  <ellipse cx="950" cy="430" rx="320" ry="260" fill="url(#glow15b)"/>
  <!-- Mobile phone -->
  <rect x="490" y="130" width="220" height="390" rx="28" fill="white" opacity="0.08" stroke="white" stroke-width="2" stroke-opacity="0.25"/>
  <rect x="502" y="162" width="196" height="320" rx="8" fill="white" opacity="0.04"/>
  <circle cx="600" cy="497" r="15" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.2"/>
  <rect x="560" y="140" width="80" height="6" rx="3" fill="white" opacity="0.15"/>
  <!-- Chat bubbles inside phone -->
