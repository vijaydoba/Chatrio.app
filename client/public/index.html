<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Apply theme before first paint to avoid a light flash.
      // First-time visitors default to dark; returning users keep their saved choice.
      (function () {
        try {
          var t = localStorage.getItem("theme") || "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chatrio" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="keywords" content="chat with strangers, random chat, anonymous chat, Omegle alternative, free chat, stranger chat, online chat, random chat app India" />
    <meta name="application-name" content="Chatrio" />
    <meta name="robots" content="index, follow, max-snippet:160, max-image-preview:large" />
    <meta name="author" content="Chatrio" />

    <!-- Open Graph (static across all pages) -->
    <meta property="og:site_name" content="Chatrio" />
    <meta property="og:image" content="https://chatrio.app/branding/chatrio-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://chatrio.app/branding/chatrio-512.png" />

    <!-- JSON-LD: WebSite + Organization (sitewide); WebApplication lives only on Home via Helmet -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://chatrio.app/#website",
          "url": "https://chatrio.app/",
          "name": "Chatrio",
          "alternateName": "Chatrio - Chat with Strangers",
          "description": "Anonymous random chat with strangers — no sign-up required.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://chatrio.app/blog?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://chatrio.app/#org",
          "name": "Chatrio",
          "url": "https://chatrio.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://chatrio.app/branding/chatrio-512.png",
            "width": 512,
            "height": 512
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "chatrioapp@gmail.com",
            "contactType": "customer support"
          }
        }
      ]
    }
    </script>

    <!-- Favicon: SVG for Chrome/Firefox (supports gradient), PNG fallback for Safari/Google -->
    <link rel="icon" href="%PUBLIC_URL%/branding/chatrio-favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/branding/chatrio-512.png" />
    <link rel="icon" type="image/png" sizes="64x64"  href="%PUBLIC_URL%/branding/chatrio-64.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/branding/chatrio-512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Chatrio</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PFV6PRM1N2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PFV6PRM1N2');
    </script>

    <!-- Google AdSense Auto Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4413754398988234" crossorigin="anonymous"></script>

  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
