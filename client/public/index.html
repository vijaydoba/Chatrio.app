<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Apply theme before first paint to avoid a light flash.
      // First-time visitors default to dark; returning users keep their saved choice.
      (function () {
        try {
          var t = localStorage.getItem("theme") || "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chatrio" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="keywords" content="chat with strangers, random chat, anonymous chat, Omegle alternative, free chat, stranger chat, online chat, random chat app India" />
    <meta name="application-name" content="Chatrio" />
    <meta name="robots" content="index, follow, max-snippet:160, max-image-preview:large" />
    <meta name="author" content="Chatrio" />

    <!-- JSON-LD: WebSite + Organization (sitewide); WebApplication lives only on Home via Helmet -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://chatrio.app/#website",
          "url": "https://chatrio.app/",
          "name": "Chatrio",
          "alternateName": "Chatrio - Chat with Strangers",
          "description": "Anonymous random chat with strangers — no sign-up required.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://chatrio.app/blog?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://chatrio.app/#org",
          "name": "Chatrio",
          "url": "https://chatrio.app/",
          "sameAs": [
            "https://x.com/Chatrioapp1",
            "https://discord.gg/289JDCJtRj"
          ],
          "logo": {
            "@type": "ImageObject",
            "url": "https://chatrio.app/branding/chatrio-icon-512-2026.png",
            "width": 512,
            "height": 512
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "chatrioapp@gmail.com",
            "contactType": "customer support"
          }
        }
      ]
    }
    </script>
